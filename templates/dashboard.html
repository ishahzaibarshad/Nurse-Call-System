<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Nurse Call System</title>

  <script src="/static/js/chart.min.js"></script>
  <link href="/static/css/output.css" rel="stylesheet" />

  <style>
    :root{
      --bg: #f6f7fb;
      --panel: #ffffff;
      --panel2: #f4f6fb;
      --text: #0f172a;
      --muted: #64748b;
      --border: rgba(15, 23, 42, .10);
      --shadow: 0 10px 24px rgba(2, 6, 23, .08);
      --shadow2: 0 16px 40px rgba(2, 6, 23, .12);
      --radius: 18px;
      --radius2: 22px;

      --accent: #3b82f6;
    }

    html, body { height: 100%; }
    body{
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height: 100vh;
    }

    .app { display:flex; min-height:100vh; width:100%; }

    /* ✅ Sidebar shell container (MATCH calls.html) */
    /* ✅ Sidebar size + no scrollbar */
    .sidebar{ width: 150px; padding:14px; flex: 0 0 auto; }
    .sidebar .shell{
      
      height: calc(100vh - 28px);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(17,24,39,.98), rgba(31,41,55,.96));
      box-shadow: var(--shadow2);
      overflow: hidden;                 /* ✅ no sidebar scroll */
      border: 1px solid rgba(255,255,255,.08);
    }

    .sidebar .shell, .sidebar .shell * { color:#fff; }

    /* Active nav style */
    .sidebar-item.is-active{
      color:#fff !important;
      background: rgba(255,255,255,.14) !important;
      box-shadow: 0 10px 24px rgba(2,6,23,.18);
    }

    .main{ flex:1; min-width:0; display:flex; flex-direction:column; }

    /* Topbar */
    .topbar{
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 18px 22px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .title h1{
      margin:0;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    .title p{
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .toolbar{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .seg{
      display:inline-flex;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15,23,42,.04);
    }
    .seg button{
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: rgba(15,23,42,.70);
      transition: .15s ease;
      user-select:none;
    }
    .seg button.active{
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 8px 18px rgba(2,6,23,.10);
    }

    .search{
      position:relative;
    }
    .search input{
      width: 240px;
      max-width: 70vw;
      padding: 10px 12px 10px 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 6px 16px rgba(2,6,23,.06);
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
      outline:none;
    }
    .search svg{
      position:absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      opacity:.6;
    }

    /* Content */
    .content{
      padding: 18px 22px 28px;
      overflow:auto;
      flex: 1;
      min-height: 0;
    }

    .stats{
      display:grid;
      gap: 16px;
      grid-template-columns: repeat(4, minmax(220px, 1fr));
    }
    @media(max-width: 1100px){
      .stats{ grid-template-columns: repeat(2, minmax(220px, 1fr)); }
    }

    .card{
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      box-shadow: 0 6px 18px rgba(2,6,23,.06);
      overflow:hidden;
    }

    .statCard{
      padding: 16px 16px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
    }
    .statCard .k{
      font-size: 12px;
      font-weight: 900;
      color: rgba(15,23,42,.70);
    }
    .statCard .sub{
      margin-top: 4px;
      font-size: 11px;
      font-weight: 800;
      color: rgba(100,116,139,.85);
    }
    .statVal{
      margin-top: 14px;
      display:flex;
      align-items:flex-end;
      gap: 10px;
    }
    .statVal .num{
      font-size: 30px;
      font-weight: 1000;
      letter-spacing: -0.4px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(15,23,42,.04);
      color: rgba(15,23,42,.70);
      white-space: nowrap;
    }
    .pill.green{
      background: rgba(34,197,94,.12);
      border-color: rgba(34,197,94,.28);
      color: #166534;
    }

    .iconBubble{
      width: 44px;
      height: 44px;
      border-radius: 999px;
      display:grid;
      place-items:center;
      border: 1px solid rgba(15,23,42,.08);
    }
    .bBlue{ background: rgba(59,130,246,.12); color: #2563eb; }
    .bRed{ background: rgba(239,68,68,.12); color: #dc2626; }
    .bGray{ background: rgba(100,116,139,.12); color: #475569; }

    /* Chart */
    .chartHead{
      padding: 16px 18px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(15,23,42,.08);
      flex-wrap: wrap;
    }
    .chartHead h2{
      margin:0;
      font-size: 15px;
      font-weight: 1000;
      letter-spacing: -0.2px;
    }
    .chartHead p{
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }
    .chartActions{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }
    .btnGhost{
      border: 1px solid rgba(15,23,42,.10);
      background: rgba(15,23,42,.03);
      color: rgba(15,23,42,.75);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 900;
      font-size: 12px;
      transition: .15s ease;
    }
    .btnGhost:hover{ transform: translateY(-1px); box-shadow: var(--shadow); }
    .btnLink{
      border: 0;
      background: transparent;
      color: #2563eb;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 900;
      font-size: 12px;
      transition: .15s ease;
    }
    .btnLink:hover{ background: rgba(37,99,235,.08); }

    .chartBody{ padding: 14px 16px 18px; }
    .chartWrap{
      position: relative;
      height: 320px;
      width: 100%;
    }

    /* ✅ Responsive (MATCH calls.html) */
    @media (max-width: 1024px){
      .sidebar{ display:none; }
      .topbar{ padding: 16px; }
      .content{ padding: 14px 16px 22px; }
      .stats{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- ✅ Sidebar (Server-side include) -->
    <aside class="sidebar">
      <div class="shell">
        {% include "sidebar.html" %}
      </div>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="title">
          <h1>Dashboard</h1>
          <p>Overview of active events, calls and timeline</p>
        </div>

        <div class="toolbar">
          <div class="seg" id="seg">
            <button id="btn-day"   data-filter="day"   onclick="app.setTimeFilter('day')">Day</button>
            <button id="btn-7days" data-filter="7days" onclick="app.setTimeFilter('7days')">7 days</button>
            <button id="btn-month" data-filter="month" onclick="app.setTimeFilter('month')">Month</button>
            <button id="btn-year"  data-filter="year"  onclick="app.setTimeFilter('year')">Year</button>
            <button id="btn-all"   data-filter="all"   onclick="app.setTimeFilter('all')">All time</button>
          </div>

          <div class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15z" stroke="rgba(15,23,42,.55)" stroke-width="2"/>
              <path d="M16.6 16.6L21 21" stroke="rgba(15,23,42,.55)" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input id="search-input" type="text" placeholder="Search" />
          </div>
        </div>
      </header>

      <div class="content">
        <!-- Stats -->
        <div class="stats">
          <div class="card statCard">
            <div>
              <div class="k">Total Active Events</div>
              <div class="sub">Last 7 days</div>
              <div class="statVal">
                <div class="num" id="stat-total">0</div>
                <span class="pill green">+3</span>
              </div>
            </div>
            <div class="iconBubble bBlue" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M4 7a2 2 0 0 1 2-2h5l2 2h5a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z" fill="currentColor"/>
              </svg>
            </div>
          </div>

          <div class="card statCard">
            <div>
              <div class="k">Urgent Alarms</div>
              <div class="sub">Last 7 days</div>
              <div class="statVal">
                <div class="num" id="stat-urgent">0</div>
                <span class="pill">0</span>
              </div>
            </div>
            <div class="iconBubble bRed" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M12 2a7 7 0 0 0-7 7v4l-2 2v1h18v-1l-2-2V9a7 7 0 0 0-7-7zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z" fill="currentColor"/>
              </svg>
            </div>
          </div>

          <div class="card statCard">
            <div>
              <div class="k">Ongoing Calls</div>
              <div class="sub">Last 7 days</div>
              <div class="statVal">
                <div class="num" id="stat-calls">0</div>
                <span class="pill">+5</span>
              </div>
            </div>
            <div class="iconBubble bBlue" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M6.6 10.8c1.7 3.3 3.9 5.5 7.2 7.2l2.4-2.4c.3-.3.8-.4 1.2-.3 1.3.4 2.7.7 4.1.7.7 0 1.2.5 1.2 1.2V21c0 .7-.5 1.2-1.2 1.2C10.7 22.2 1.8 13.3 1.8 2.7 1.8 2 2.3 1.5 3 1.5h3.9c.7 0 1.2.5 1.2 1.2 0 1.4.2 2.8.7 4.1.1.4 0 .9-.3 1.2L6.6 10.8z" fill="currentColor"/>
              </svg>
            </div>
          </div>

          <div class="card statCard">
            <div>
              <div class="k">Recently Cleared</div>
              <div class="sub">Last 7 days</div>
              <div class="statVal">
                <div class="num" id="stat-cleared">0</div>
                <span class="pill">/hour</span>
              </div>
            </div>
            <div class="iconBubble bGray" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 14-4-4 1.4-1.4L11 13.2l5.6-5.6L18 9l-7 7z" fill="currentColor"/>
              </svg>
            </div>
          </div>
        </div>

        <!-- Timeline -->
        <div class="card" style="margin-top:16px;">
          <div class="chartHead">
            <div>
              <h2>Event Timeline Distribution</h2>
              <p id="timeline-sub">Last 24 days</p>
            </div>
            <div class="chartActions">
              <button class="btnLink" type="button">Download report ↓</button>
              <button class="btnGhost" type="button">Event type filters</button>
            </div>
          </div>
          <div class="chartBody">
            <div class="chartWrap">
              <canvas id="timelineChart"></canvas>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    // ✅ Highlight active sidebar item (works for all pages)
    (function setActiveNav(){
      const path = location.pathname === "/" ? "dashboard" : location.pathname.split("/")[1];
      document.querySelectorAll("[data-nav]").forEach(a => {
        a.classList.toggle("is-active", a.getAttribute("data-nav") === path);
      });
    })();

    const app = {
      data: {
        stats: { total_active: 0, urgent_alarms: 0, ongoing_calls: 0, recently_cleared: 0 },
        timeFilter: '7days',
        timelineChart: null,
        ws: null,
        customColors: {},
      },

      async init() {
        await this.loadCustomColors(true);
        this.setupWebSocket();
        this.loadStats();
        this.loadTimeline();
        this.updateFilterButtons();

        setInterval(() => this.loadStats(), 10000);
        setInterval(() => this.loadTimeline(), 30000);
        setInterval(() => this.loadCustomColors(true), 30000);
      },

      setupWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        this.data.ws = new WebSocket(`${protocol}://${window.location.host}/ws`);

        this.data.ws.onmessage = () => {
          this.loadStats();
          this.loadTimeline();
        };

        this.data.ws.onclose = () => setTimeout(() => this.setupWebSocket(), 5000);
      },

      applyThemeIfProvided(data){
        const scheme = data?.scheme || data?.theme || data?.active_scheme || null;
        if (!scheme || typeof scheme !== 'object') return;

        const map = {
          bg: scheme.bg || scheme.background || scheme.page_bg,
          panel: scheme.panel || scheme.surface || scheme.card_bg,
          panel2: scheme.panel2 || scheme.surface2 || scheme.subtle_bg,
          text: scheme.text || scheme.fg || scheme.text_color,
          muted: scheme.muted || scheme.muted_text || scheme.subtext,
          border: scheme.border || scheme.border_color,
          accent: scheme.accent || scheme.primary || scheme.primary_color,
        };

        const root = document.documentElement.style;
        if (map.bg) root.setProperty('--bg', map.bg);
        if (map.panel) root.setProperty('--panel', map.panel);
        if (map.panel2) root.setProperty('--panel2', map.panel2);
        if (map.text) root.setProperty('--text', map.text);
        if (map.muted) root.setProperty('--muted', map.muted);
        if (map.border) root.setProperty('--border', map.border);
        if (map.accent) root.setProperty('--accent', map.accent);
      },

      async loadCustomColors(applyThemeAlso = true) {
        try {
          const response = await fetch('/api/config/colors');
          const data = await response.json();

          if (applyThemeAlso) this.applyThemeIfProvided(data);

          const next = {};
          const arr = data.colors || data || [];
          if (Array.isArray(arr)) {
            arr.forEach(c => {
              const key = String(c.event_type || c.eventType || '').toLowerCase().trim();
              const col = c.color || c.primary_color || c.primaryColor;
              if (key && col) next[key] = col;
            });
          }
          this.data.customColors = next;
        } catch (e) {
          console.error("[dashboard] colors error:", e);
        }
      },

      async loadStats() {
        try {
          const response = await fetch('/api/stats');
          const stats = await response.json();
          this.data.stats = stats;

          document.getElementById('stat-total').textContent = stats.total_active ?? 0;
          document.getElementById('stat-urgent').textContent = stats.urgent_alarms ?? 0;
          document.getElementById('stat-calls').textContent = stats.ongoing_calls ?? 0;
          document.getElementById('stat-cleared').textContent = stats.recently_cleared ?? 0;
        } catch (e) {
          console.error("[dashboard] Error loading stats:", e);
        }
      },

      async loadTimeline() {
        try {
          const days = this.getFilteredDays();
          const response = await fetch(`/api/timeline?days=${days}`);
          const data = await response.json();
          this.renderTimelineChart(data.timeline || {});
        } catch (e) {
          console.error("[dashboard] Error loading timeline:", e);
        }
      },

      renderTimelineChart(timelineData) {
        const ctx = document.getElementById('timelineChart');
        if (!ctx) return;

        const labels = Object.keys(timelineData).sort();
        const datasets = {};

        labels.forEach(date => {
          const dayObj = timelineData[date] || {};
          Object.keys(dayObj).forEach(eventType => {
            if (!datasets[eventType]) {
              const col = this.getEventTypeColor(eventType);
              datasets[eventType] = {
                label: eventType,
                data: [],
                borderColor: col,
                backgroundColor: this.hexToRgba(col, 0.18),
                tension: 0.4,
                fill: true
              };
            }
          });
        });

        labels.forEach(date => {
          Object.keys(datasets).forEach(eventType => {
            datasets[eventType].data.push((timelineData[date] || {})[eventType] || 0);
          });
        });

        if (this.data.timelineChart) this.data.timelineChart.destroy();

        this.data.timelineChart = new Chart(ctx, {
          type: 'line',
          data: { labels, datasets: Object.values(datasets) },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: true, position: 'top' } },
            scales: { y: { beginAtZero: true } }
          }
        });

        document.getElementById('timeline-sub').textContent =
          `Last ${Math.min(labels.length, this.getFilteredDays())} day(s)`;
      },

      getFilteredDays() {
        const filterMap = { day: 1, '7days': 7, month: 30, year: 365, all: 3650 };
        return filterMap[this.data.timeFilter] || 7;
      },

      setTimeFilter(filter) {
        this.data.timeFilter = filter;
        this.updateFilterButtons();
        this.loadTimeline();
      },

      updateFilterButtons() {
        document.querySelectorAll('#seg button').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === this.data.timeFilter);
        });
      },

      getEventTypeColor(type) {
        const t = String(type || '').toLowerCase().trim();
        if (this.data.customColors[t]) return this.data.customColors[t];

        const defaults = {
          call: '#3b82f6',
          emergency: '#ef4444',
          alarm: '#f59e0b',
          assistance: '#8b5cf6',
          accept: '#10b981',
          cancel: '#6b7280',
          presence: '#06b6d4',
          reset: '#64748b',
          system: '#334155',
          unknown: '#64748b'
        };
        return defaults[t] || '#3b82f6';
      },

      hexToRgba(hex, a) {
        const h = String(hex || '').replace('#','');
        if (h.length !== 6) return `rgba(59,130,246,${a})`;
        const r = parseInt(h.slice(0,2),16);
        const g = parseInt(h.slice(2,4),16);
        const b = parseInt(h.slice(4,6),16);
        return `rgba(${r},${g},${b},${a})`;
      }
    };

    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>

</body>
</html>
