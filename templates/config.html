<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>System Configuration - Hospital Monitoring</title>

  <!-- Keep your existing css -->
  <link href="/static/css/output.css" rel="stylesheet">

  <!-- Beautiful UI fallback CSS (works even if tailwind not applied) -->
  <style>
    :root{
      --bg1:#f6f7ff;
      --bg2:#f3fbff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e2e8f0;
      --shadow: 0 10px 30px rgba(15,23,42,.08);
      --shadow2: 0 12px 50px rgba(15,23,42,.10);
      --primary:#0f172a;
      --accent:#4f46e5;
      --accent2:#06b6d4;
      --danger:#ef4444;
      --ok:#22c55e;
      --warn:#f59e0b;
      --radius:18px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 15% 10%, rgba(79,70,229,.12), transparent 55%),
        radial-gradient(1200px 600px at 85% 0%, rgba(6,182,212,.10), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height: 100vh;
    }

    .layout{
      display:flex;
      min-height:100vh;
      width:100%;
    }
    .sidebar{
      width: 260px;
      padding: 18px;
      display:none;
    }
    .sidebar .shell{
      height: calc(100vh - 36px);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: var(--radius);
      background: rgba(15,23,42,.92);
      box-shadow: var(--shadow2);
      overflow:auto;
    }
    .sidebar .shell *{ color:#fff; }
    @media (min-width: 1024px){
      .sidebar{ display:block; }
    }

    .main{
      flex:1;
      padding: 22px;
    }
    .container{
      max-width: 1180px;
      margin: 0 auto;
    }

    .topbar{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 16px;
    }
    .title{
      display:flex;
      flex-direction:column;
      gap:4px;
    }
    .title h1{
      margin:0;
      font-size: 26px;
      letter-spacing: -0.02em;
    }
    .title p{
      margin:0;
      color:var(--muted);
      font-size: 13px;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }

    .chipRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin: 14px 0 18px;
    }

    .tabs{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      padding: 10px;
      background: rgba(255,255,255,.75);
      border: 1px solid rgba(226,232,240,.9);
      border-radius: 999px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 25px rgba(15,23,42,.06);
    }
    .tabBtn{
      border:1px solid rgba(226,232,240,1);
      background: #fff;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:600;
      font-size: 13px;
      display:flex;
      align-items:center;
      gap:8px;
      transition: all .18s ease;
      user-select:none;
    }
    .tabBtn:hover{
      transform: translateY(-1px);
      box-shadow: 0 10px 25px rgba(15,23,42,.08);
      border-color: rgba(79,70,229,.35);
    }
    .tabBtn.active{
      background: linear-gradient(135deg, rgba(79,70,229,1), rgba(6,182,212,1));
      color:#fff;
      border-color: transparent;
      box-shadow: 0 15px 40px rgba(79,70,229,.25);
    }
    .countPill{
      font-size: 12px;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(15,23,42,.06);
      color: var(--text);
      font-weight: 700;
    }
    .tabBtn.active .countPill{
      background: rgba(255,255,255,.22);
      color:#fff;
    }

    .card{
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(226,232,240,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow:hidden;
    }
    .cardHead{
      padding: 16px 18px;
      border-bottom: 1px solid rgba(226,232,240,.9);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap: wrap;
    }
    .cardHead h3{
      margin:0;
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .cardHead .sub{
      margin-top:4px;
      color:var(--muted);
      font-size: 12px;
    }
    .cardBody{
      padding: 14px 14px 16px;
    }

    .gridTop{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 12px;
      align-items:center;
      margin-bottom: 12px;
    }
    @media(max-width: 860px){
      .gridTop{ grid-template-columns: 1fr; }
    }

    .input{
      width:100%;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(226,232,240,1);
      outline:none;
      font-size: 14px;
      background:#fff;
      transition: all .15s ease;
    }
    .input:focus{
      border-color: rgba(79,70,229,.6);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }

    .btn{
      border:1px solid rgba(226,232,240,1);
      background:#fff;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight:700;
      font-size: 13px;
      transition: all .18s ease;
      display:inline-flex;
      align-items:center;
      gap:8px;
      user-select:none;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 10px 22px rgba(15,23,42,.08); }
    .btnPrimary{
      background: linear-gradient(135deg, rgba(15,23,42,1), rgba(79,70,229,1));
      color:#fff;
      border-color: transparent;
    }
    .btnDanger{
      background: rgba(239,68,68,.08);
      border-color: rgba(239,68,68,.25);
      color: #b91c1c;
    }
    .btnGhost{
      background: rgba(15,23,42,.04);
      border-color: rgba(15,23,42,.08);
    }

    .tableWrap{
      overflow:auto;
      border: 1px solid rgba(226,232,240,.9);
      border-radius: 16px;
      background:#fff;
    }
    table{
      width:100%;
      border-collapse: separate;
      border-spacing:0;
      min-width: 780px;
      font-size: 13px;
    }
    thead th{
      position: sticky;
      top:0;
      z-index:2;
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      color: var(--muted);
      font-weight: 800;
      text-align:left;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(226,232,240,1);
      white-space: nowrap;
    }
    tbody td{
      padding: 12px 12px;
      border-bottom: 1px solid rgba(226,232,240,.75);
      vertical-align: middle;
      white-space: nowrap;
    }
    tbody tr:hover{
      background: rgba(79,70,229,.06);
    }
    tbody tr:last-child td{ border-bottom: 0; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 12px;
      border: 1px solid rgba(226,232,240,1);
      background: rgba(15,23,42,.04);
    }
    .bOk{ background: rgba(34,197,94,.10); border-color: rgba(34,197,94,.25); color: #166534; }
    .bWarn{ background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.30); color: #92400e; }
    .bOff{ background: rgba(100,116,139,.12); border-color: rgba(100,116,139,.22); color: #334155; }

    /* Toast */
    #toast{
      position: fixed;
      bottom: 16px;
      right: 16px;
      max-width: 420px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(15,23,42,.92);
      color: #fff;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.14);
      display:none;
      animation: pop .18s ease;
    }
    @keyframes pop{
      from{ transform: translateY(10px); opacity:.5; }
      to{ transform: translateY(0); opacity:1; }
    }

    /* Modal */
    #modalWrap{
      position: fixed;
      inset:0;
      background: rgba(2,6,23,.48);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }
    .modal{
      width: min(760px, 100%);
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(226,232,240,.9);
      border-radius: 22px;
      box-shadow: 0 30px 90px rgba(15,23,42,.22);
      backdrop-filter: blur(12px);
      overflow:hidden;
      animation: pop .16s ease;
    }
    .modalHead{
      padding: 16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      border-bottom: 1px solid rgba(226,232,240,.9);
    }
    .modalHead h2{
      margin:0;
      font-size: 16px;
      letter-spacing: -0.01em;
    }
    .modalBody{ padding: 16px 18px 4px; }
    .modalGrid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media(max-width: 720px){
      .modalGrid{ grid-template-columns: 1fr; }
    }
    .field label{
      display:block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 800;
    }
    .field input, .field select{
      width:100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(226,232,240,1);
      outline:none;
      background:#fff;
    }
    .field input:focus, .field select:focus{
      border-color: rgba(79,70,229,.6);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }
    .modalFoot{
      padding: 14px 18px 16px;
      display:flex;
      justify-content:flex-end;
      gap: 10px;
      border-top: 1px solid rgba(226,232,240,.9);
    }

    .mutedSmall{ color: var(--muted); font-size: 12px; }

    .empty{
      padding: 22px;
      text-align:center;
      color: var(--muted);
    }
    .empty strong{ color: var(--text); }

    .icon{
      width: 16px; height:16px; display:inline-block;
    }
  </style>
</head>

<body>
  <div class="layout">
    <!-- Sidebar (optional) -->
    <aside class="sidebar">
      <div id="sidebar" class="shell"></div>
    </aside>

    <main class="main">
      <div class="container">

        <!-- Top -->
        <div class="topbar">
          <div class="title">
            <h1>System Configuration</h1>
            <p>Manage Floors • Wards • Rooms • Beds • Colors (fast edit + clean UI)</p>
          </div>

          <div class="actions">
            <input id="searchInput" class="input" style="max-width: 320px;" placeholder="Search in current tab..." />
            <button id="refreshBtn" class="btn btnPrimary" type="button">
              <svg class="icon" viewBox="0 0 24 24" fill="none">
                <path d="M21 12a9 9 0 1 1-2.64-6.36" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M21 3v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              Refresh
            </button>
          </div>
        </div>

        <!-- Tabs -->
        <div class="tabs" id="tabs">
          <button class="tabBtn active" data-tab="floors">Floors <span class="countPill" id="count-floors">0</span></button>
          <button class="tabBtn" data-tab="wards">Wards <span class="countPill" id="count-wards">0</span></button>
          <button class="tabBtn" data-tab="rooms">Rooms <span class="countPill" id="count-rooms">0</span></button>
          <button class="tabBtn" data-tab="beds">Beds <span class="countPill" id="count-beds">0</span></button>
          <button class="tabBtn" data-tab="colors">Colors <span class="countPill" id="count-colors">0</span></button>
        </div>

        <!-- Toast -->
        <div id="toast"></div>

        <!-- Sections -->
        <section id="sec-floors" style="margin-top:16px;"></section>
        <section id="sec-wards" style="margin-top:16px; display:none;"></section>
        <section id="sec-rooms" style="margin-top:16px; display:none;"></section>
        <section id="sec-beds" style="margin-top:16px; display:none;"></section>
        <section id="sec-colors" style="margin-top:16px; display:none;"></section>

      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modalWrap">
    <div class="modal">
      <div class="modalHead">
        <h2 id="modalTitle">Modal</h2>
        <button id="modalClose" class="btn btnGhost" type="button">✕</button>
      </div>

      <form id="modalForm">
        <div class="modalBody">
          <div id="modalBody" class="modalGrid"></div>
        </div>
        <div class="modalFoot">
          <button type="button" id="modalCancel" class="btn">Cancel</button>
          <button type="submit" class="btn btnPrimary">Save</button>
        </div>
      </form>
    </div>
  </div>

<script>
(function () {
  const API = {
    floors: "/api/config/floors",
    wards: "/api/config/wards",
    rooms: "/api/config/rooms",
    beds: "/api/config/beds",
    colors: "/api/config/colors",
  };

  const state = {
    floors: [], wards: [], rooms: [], beds: [], colors: [],
    activeTab: "floors",
    q: ""
  };

  const $ = (id) => document.getElementById(id);

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[c]));
  }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = "none"; }, 2600);
  }

  async function apiFetch(url, opts = {}) {
    const o = Object.assign({ headers: {} }, opts);
    if (o.body && typeof o.body !== "string") {
      o.headers["Content-Type"] = "application/json";
      o.body = JSON.stringify(o.body);
    }
    const res = await fetch(url, o);
    const txt = await res.text();
    let data = null;
    try { data = txt ? JSON.parse(txt) : null; } catch { data = { raw: txt }; }
    if (!res.ok) {
      const err = (data && (data.error || data.message)) ? (data.error || data.message) : ("HTTP " + res.status);
      throw new Error(err);
    }
    return data;
  }

  function badge(status) {
    const s = String(status || "").toLowerCase();
    if (s === "active" || s === "available") return `<span class="badge bOk">${esc(status)}</span>`;
    if (s === "inactive") return `<span class="badge bOff">${esc(status)}</span>`;
    return `<span class="badge bWarn">${esc(status || "unknown")}</span>`;
  }

  function setCounts() {
    $("count-floors").textContent = state.floors.length;
    $("count-wards").textContent  = state.wards.length;
    $("count-rooms").textContent  = state.rooms.length;
    $("count-beds").textContent   = state.beds.length;
    $("count-colors").textContent = state.colors.length;
  }

  function setTab(tab) {
    state.activeTab = tab;
    document.querySelectorAll(".tabBtn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));

    ["floors","wards","rooms","beds","colors"].forEach(t => {
      $("sec-" + t).style.display = (t === tab) ? "block" : "none";
    });

    renderActive();
  }

  function filterList(list, fields) {
    const q = (state.q || "").trim().toLowerCase();
    if (!q) return list;
    return list.filter(it => fields.some(f => String(it?.[f] ?? "").toLowerCase().includes(q)));
  }

  async function provideSidebar() {
    try {
      const r = await fetch("/sidebar.html");
      if (!r.ok) return;
      $("sidebar").innerHTML = await r.text();
    } catch {}
  }

  async function loadAll() {
    const [floors, wards, rooms, beds, colors] = await Promise.all([
      apiFetch(API.floors),
      apiFetch(API.wards),
      apiFetch(API.rooms),
      apiFetch(API.beds),
      apiFetch(API.colors),
    ]);

    state.floors = floors.floors || [];
    state.wards  = wards.wards || [];
    state.rooms  = rooms.rooms || [];
    state.beds   = beds.beds || [];
    state.colors = colors.colors || [];

    setCounts();
    renderActive();
  }

  function shellCard(title, sub, addAction, headHtml, bodyHtml, emptyCols) {
    return `
      <div class="card">
        <div class="cardHead">
          <div>
            <h3>${esc(title)}</h3>
            <div class="sub">${esc(sub)}</div>
          </div>

          <button class="btn btnPrimary" data-action="${esc(addAction)}" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
              <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            Add
          </button>
        </div>

        <div class="cardBody">
          <div class="tableWrap">
            <table>
              <thead><tr>${headHtml}</tr></thead>
              <tbody>
                ${bodyHtml || `<tr><td colspan="${emptyCols}" class="empty"><strong>No data</strong><div class="mutedSmall">Add a new record to get started.</div></td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    `;
  }

  function renderFloors() {
    const items = filterList(state.floors, ["name","status","floor_number","floorNumber","description"]);
    const rows = items.map(f => `
      <tr>
        <td><strong>${esc(f.name)}</strong></td>
        <td>${esc(f.floor_number ?? f.floorNumber ?? "")}</td>
        <td>${badge(f.status)}</td>
        <td>${esc(f.wards ?? 0)}</td>
        <td>
          <button class="btn" data-action="edit-floor" data-id="${esc(f.id)}" type="button">Edit</button>
          <button class="btn btnDanger" data-action="del-floor" data-id="${esc(f.id)}" type="button">Delete</button>
        </td>
      </tr>
    `).join("");

    $("sec-floors").innerHTML = shellCard(
      "Floors",
      "Create floors, set status and manage structure.",
      "add-floor",
      `<th>Name</th><th>No</th><th>Status</th><th>Wards</th><th>Actions</th>`,
      rows,
      5
    );
  }

  function renderWards() {
    const floorNameById = Object.fromEntries(state.floors.map(f => [String(f.id), f.name]));
    const items = filterList(state.wards, ["name","ward_type","wardType","type","status","description"]);
    const rows = items.map(w => `
      <tr>
        <td><strong>${esc(w.name)}</strong></td>
        <td>${esc(floorNameById[String(w.floor_id ?? w.floorId)] || (w.floor_id ?? w.floorId ?? ""))}</td>
        <td>${esc(w.ward_type || w.wardType || w.type || "")}</td>
        <td>${badge(w.status)}</td>
        <td>${esc(w.rooms ?? 0)}</td>
        <td>
          <button class="btn" data-action="edit-ward" data-id="${esc(w.id)}" type="button">Edit</button>
          <button class="btn btnDanger" data-action="del-ward" data-id="${esc(w.id)}" type="button">Delete</button>
        </td>
      </tr>
    `).join("");

    $("sec-wards").innerHTML = shellCard(
      "Wards",
      "Assign wards to floors and maintain type/status.",
      "add-ward",
      `<th>Name</th><th>Floor</th><th>Type</th><th>Status</th><th>Rooms</th><th>Actions</th>`,
      rows,
      6
    );
  }

  function renderRooms() {
    const wardNameById = Object.fromEntries(state.wards.map(w => [String(w.id), w.name]));
    const items = filterList(state.rooms, ["room_name","roomName","room_number","roomNumber","system_ip","systemIp","status"]);
    const rows = items.map(r => `
      <tr>
        <td><strong>${esc(r.room_name || r.roomName || "")}</strong></td>
        <td>${esc(r.room_number || r.roomNumber || "")}</td>
        <td>${esc(wardNameById[String(r.ward_id ?? r.wardId)] || (r.ward_id ?? r.wardId ?? ""))}</td>
        <td>${esc(r.system_ip || r.systemIp || "")}</td>
        <td>${badge(r.status || "active")}</td>
        <td>
          <button class="btn" data-action="edit-room" data-id="${esc(r.id)}" type="button">Edit</button>
          <button class="btn btnDanger" data-action="del-room" data-id="${esc(r.id)}" type="button">Delete</button>
        </td>
      </tr>
    `).join("");

    $("sec-rooms").innerHTML = shellCard(
      "Rooms",
      "Rooms belong to wards. Store room name/number and system IP.",
      "add-room",
      `<th>Room Name</th><th>Room No</th><th>Ward</th><th>System IP</th><th>Status</th><th>Actions</th>`,
      rows,
      6
    );
  }

  function renderBeds() {
    const roomNameById = Object.fromEntries(
      state.rooms.map(r => [String(r.id), (r.room_name || r.roomName || r.name || "")])
    );
    const items = filterList(state.beds, ["bed_number","bedNumber","bedNo","bed_name","bedName","intercom_ip","ipAddress","ip_address","status","room_name","roomName"]);
    const rows = items.map(b => `
      <tr>
        <td>${esc(roomNameById[String(b.room_id ?? b.roomId)] || (b.room_name || b.room_id || ""))}</td>
        <td><strong>${esc(b.bed_number || b.bedNumber || b.bedNo || "")}</strong></td>
        <td>${esc(b.bed_name || b.bedName || "")}</td>
        <td>${esc(b.intercom_ip || b.ipAddress || b.ip_address || "")}</td>
        <td>${badge(b.status || "available")}</td>
        <td>
          <button class="btn" data-action="edit-bed" data-id="${esc(b.id)}" type="button">Edit</button>
          <button class="btn btnDanger" data-action="del-bed" data-id="${esc(b.id)}" type="button">Delete</button>
        </td>
      </tr>
    `).join("");

    $("sec-beds").innerHTML = shellCard(
      "Beds",
      "Beds map intercom IP to a room. Edit quickly and keep clean mapping.",
      "add-bed",
      `<th>Room</th><th>Bed No</th><th>Bed Name</th><th>Intercom IP</th><th>Status</th><th>Actions</th>`,
      rows,
      6
    );
  }

  function renderColors() {
    const items = filterList(state.colors, ["event_type","eventType","color"]);
    const rows = items.map(c => `
      <tr>
        <td><strong>${esc(c.event_type || c.eventType || "")}</strong></td>
        <td>${esc(c.color || "")}</td>
        <td>
          <button class="btn" data-action="edit-color" data-id="${esc(c.id)}" type="button">Edit</button>
          <button class="btn btnDanger" data-action="del-color" data-id="${esc(c.id)}" type="button">Delete</button>
        </td>
      </tr>
    `).join("");

    $("sec-colors").innerHTML = shellCard(
      "Colors",
      "Define event color coding for dashboards.",
      "add-color",
      `<th>Event Type</th><th>Color</th><th>Actions</th>`,
      rows,
      3
    );
  }

  function renderActive() {
    if (state.activeTab === "floors") renderFloors();
    if (state.activeTab === "wards") renderWards();
    if (state.activeTab === "rooms") renderRooms();
    if (state.activeTab === "beds") renderBeds();
    if (state.activeTab === "colors") renderColors();
  }

  // ---------- Modal ----------
  const modalWrap  = $("modalWrap");
  const modalTitle = $("modalTitle");
  const modalBody  = $("modalBody");
  const modalForm  = $("modalForm");
  let modalCtx = { entity: null, mode: null, id: null };

  function openModal(entity, mode, item) {
    modalCtx = { entity, mode, id: item?.id ?? null };
    modalTitle.textContent = (mode === "create" ? "Add " : "Edit ") + entity.toUpperCase();

    const statusSelect = (val, opts) => `
      <div class="field">
        <label>Status</label>
        <select name="status">
          ${opts.map(o => `
            <option value="${o}" ${String(val || "").toLowerCase() === o ? "selected" : ""}>${o}</option>
          `).join("")}
        </select>
      </div>
    `;

    if (entity === "floor") {
      modalBody.innerHTML = `
        <div class="field">
          <label>Name</label>
          <input name="name" value="${esc(item?.name || "")}" required>
        </div>
        <div class="field">
          <label>Floor Number</label>
          <input name="floor_number" type="number" value="${esc(item?.floor_number ?? item?.floorNumber ?? "")}" required>
        </div>
        <div class="field">
          <label>Description</label>
          <input name="description" value="${esc(item?.description || "")}">
        </div>
        ${statusSelect(item?.status || "active", ["active","inactive"])}
      `;
    }

    if (entity === "ward") {
      const floorOptions = state.floors
        .map(f => `
          <option value="${esc(f.id)}" ${
            String(item?.floor_id ?? item?.floorId ?? "") === String(f.id) ? "selected" : ""
          }>${esc(f.name)}</option>
        `)
        .join("");

      modalBody.innerHTML = `
        <div class="field">
          <label>Name</label>
          <input name="name" value="${esc(item?.name || "")}" required>
        </div>
        <div class="field">
          <label>Floor</label>
          <select name="floor_id" required>
            <option value="">Select</option>
            ${floorOptions}
          </select>
        </div>
        <div class="field">
          <label>Ward Type</label>
          <input name="ward_type" value="${esc(item?.ward_type || item?.wardType || item?.type || "")}">
        </div>
        <div class="field">
          <label>Description</label>
          <input name="description" value="${esc(item?.description || "")}">
        </div>
        ${statusSelect(item?.status || "active", ["active","inactive"])}
      `;
    }

    // ✅ FIXED: wardOptions scope + removed extra brace + option labels
    if (entity === "room") {
      const wardOptions = state.wards
        .map(w => `
          <option value="${esc(w.id)}" ${
            String(item?.ward_id ?? item?.wardId ?? "") === String(w.id) ? "selected" : ""
          }>${esc(w.name)}</option>
        `)
        .join("");

      modalBody.innerHTML = `
        <div class="field">
          <label>Ward</label>
          <select name="ward_id" required>
            <option value="">Select</option>
            ${wardOptions}
          </select>
        </div>
        <div class="field">
          <label>Room Name</label>
          <input name="room_name" value="${esc(item?.room_name || item?.roomName || "")}" required>
        </div>
        <div class="field">
          <label>Room Number</label>
          <input name="room_number" value="${esc(item?.room_number || item?.roomNumber || "")}">
        </div>
        <div class="field">
          <label>System IP</label>
          <input name="system_ip" value="${esc(item?.system_ip || item?.systemIp || "")}">
        </div>
        ${statusSelect(item?.status || "active", ["active","inactive"])}
      `;
    }

    // ✅ FIXED: bed -> room options, correct selected field, labels, closing tags
    if (entity === "bed") {
      const roomOptions = state.rooms
        .map(r => {
          const label = (r.room_name || r.roomName || r.name || `Room ${r.id}`);
          const selected = String(item?.room_id ?? item?.roomId ?? "") === String(r.id);
          return `<option value="${esc(r.id)}" ${selected ? "selected" : ""}>${esc(label)}</option>`;
        })
        .join("");

      modalBody.innerHTML = `
        <div class="field">
          <label>Room</label>
          <select name="room_id" required>
            <option value="">Select</option>
            ${roomOptions}
          </select>
        </div>
        <div class="field">
          <label>Bed Number</label>
          <input name="bed_number" value="${esc(item?.bed_number || item?.bedNumber || item?.bedNo || "")}" required>
        </div>
        <div class="field">
          <label>Bed Name</label>
          <input name="bed_name" value="${esc(item?.bed_name || item?.bedName || "")}">
        </div>
        <div class="field">
          <label>Intercom IP</label>
          <input name="intercom_ip" value="${esc(item?.intercom_ip || item?.ipAddress || item?.ip_address || "")}">
        </div>
        ${statusSelect(item?.status || "available", ["available","active","inactive"])}
      `;
    }

    if (entity === "color") {
      modalBody.innerHTML = `
        <div class="field">
          <label>Event Type</label>
          <input name="event_type" value="${esc(item?.event_type || item?.eventType || "")}" required>
        </div>
        <div class="field">
          <label>Color</label>
          <input name="color" value="${esc(item?.color || "")}" placeholder="#ff0000" required>
        </div>
      `;
    }

    modalWrap.style.display = "flex";
  }

  function closeModal() {
    modalWrap.style.display = "none";
    modalBody.innerHTML = "";
  }

  $("modalClose").addEventListener("click", closeModal);
  $("modalCancel").addEventListener("click", closeModal);
  modalWrap.addEventListener("click", (e) => { if (e.target === modalWrap) closeModal(); });

  // ---------- Actions ----------
  document.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;

    const action = btn.dataset.action;
    const id = btn.dataset.id ?? null; // ✅ don't force Number()

    try {
      if (action === "add-floor") return openModal("floor", "create", null);
      if (action === "add-ward")  return openModal("ward", "create", null);
      if (action === "add-room")  return openModal("room", "create", null);
      if (action === "add-bed")   return openModal("bed",  "create", null);
      if (action === "add-color") return openModal("color","create", null);

      if (action === "edit-floor") return openModal("floor", "edit", state.floors.find(x => String(x.id) === String(id)));
      if (action === "edit-ward")  return openModal("ward",  "edit", state.wards.find(x => String(x.id) === String(id)));
      if (action === "edit-room")  return openModal("room",  "edit", state.rooms.find(x => String(x.id) === String(id)));
      if (action === "edit-bed")   return openModal("bed",   "edit", state.beds.find(x => String(x.id) === String(id)));
      if (action === "edit-color") return openModal("color", "edit", state.colors.find(x => String(x.id) === String(id)));

      if (action === "del-floor") {
        if (!confirm("Delete floor?")) return;
        await apiFetch(`${API.floors}/${id}`, { method: "DELETE" });
        toast("Floor deleted");
        return loadAll();
      }
      if (action === "del-ward") {
        if (!confirm("Delete ward?")) return;
        await apiFetch(`${API.wards}/${id}`, { method: "DELETE" });
        toast("Ward deleted");
        return loadAll();
      }
      if (action === "del-room") {
        if (!confirm("Delete room?")) return;
        await apiFetch(`${API.rooms}/${id}`, { method: "DELETE" });
        toast("Room deleted");
        return loadAll();
      }
      if (action === "del-bed") {
        if (!confirm("Delete bed?")) return;
        await apiFetch(`${API.beds}/${id}`, { method: "DELETE" });
        toast("Bed deleted");
        return loadAll();
      }
      if (action === "del-color") {
        if (!confirm("Delete color?")) return;
        await apiFetch(`${API.colors}/${id}`, { method: "DELETE" });
        toast("Color deleted");
        return loadAll();
      }
    } catch (err) {
      toast("Error: " + (err?.message || err));
    }
  });

  modalForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(modalForm);
    const entity = modalCtx.entity;
    const mode = modalCtx.mode;
    const id = modalCtx.id;

    try {
      if (entity === "floor") {
        const body = {
          name: fd.get("name"),
          floor_number: Number(fd.get("floor_number")),
          description: fd.get("description"),
          status: fd.get("status"),
        };
        if (mode === "create") await apiFetch(API.floors, { method: "POST", body });
        else await apiFetch(`${API.floors}/${id}`, { method: "PUT", body });
      }

      if (entity === "ward") {
        const body = {
          name: fd.get("name"),
          floor_id: Number(fd.get("floor_id")),
          ward_type: fd.get("ward_type"),
          description: fd.get("description"),
          status: fd.get("status"),
        };
        if (mode === "create") await apiFetch(API.wards, { method: "POST", body });
        else await apiFetch(`${API.wards}/${id}`, { method: "PUT", body });
      }

      if (entity === "room") {
        const body = {
          ward_id: Number(fd.get("ward_id")),
          room_name: fd.get("room_name"),
          room_number: fd.get("room_number"),
          system_ip: fd.get("system_ip"),
          status: fd.get("status"),
        };
        if (mode === "create") await apiFetch(API.rooms, { method: "POST", body });
        else await apiFetch(`${API.rooms}/${id}`, { method: "PUT", body });
      }

      if (entity === "bed") {
        const body = {
          room_id: Number(fd.get("room_id")),
          bed_number: fd.get("bed_number"),
          bed_name: fd.get("bed_name"),
          intercom_ip: fd.get("intercom_ip"),
          status: fd.get("status"),
        };

        if (mode === "create") {
          // supports either POST or PUT create (depends on your backend)
          try { await apiFetch(API.beds, { method: "POST", body }); }
          catch { await apiFetch(API.beds, { method: "PUT", body }); }
        } else {
          await apiFetch(`${API.beds}/${id}`, { method: "PUT", body });
        }
      }

      if (entity === "color") {
        const body = { event_type: fd.get("event_type"), color: fd.get("color") };
        if (mode === "create") await apiFetch(API.colors, { method: "POST", body });
        else await apiFetch(`${API.colors}/${id}`, { method: "PUT", body });
      }

      closeModal();
      toast("Saved ✅");
      await loadAll();
    } catch (err) {
      toast("Error: " + (err?.message || err));
    }
  });

  // Tabs
  document.querySelectorAll(".tabBtn").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

  // Search
  $("searchInput").addEventListener("input", (e) => {
    state.q = e.target.value || "";
    renderActive();
  });

  // Refresh
  $("refreshBtn").addEventListener("click", async () => {
    try { await loadAll(); toast("Refreshed ✅"); } catch (e) { toast("Error: " + e.message); }
  });

  // Init
  (async function init() {
    setTab("floors");
    await provideSidebar();
    await loadAll();
  })();

})();
</script>
</body>
</html>
