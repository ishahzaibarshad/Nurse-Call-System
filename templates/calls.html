<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Calls - Nurse Call System</title>

  <link href="/static/css/output.css" rel="stylesheet" />

  <style>
    :root{
      --bg1:#eef2ff;
      --bg2:#f7fbff;
      --card:#ffffff;
      --text:#0f172a;
      --muted:#64748b;
      --border:#e5e7eb;

      --shadow: 0 10px 30px rgba(15,23,42,.10);
      --shadow2: 0 18px 55px rgba(15,23,42,.12);

      --nav:#1f2937;
      --nav2:#111827;

      --accent:#4f46e5;
      --ok:#22c55e;
      --danger:#ef4444;

      --radius:18px;
      --radius2:22px;
    }

    *{ box-sizing:border-box; }
    html, body{ height:100%; }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(1100px 700px at 12% 10%, rgba(79,70,229,.10), transparent 55%),
        radial-gradient(1100px 700px at 90% 5%, rgba(37,99,235,.08), transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height:100vh;
    }

    .layout{ display:flex; min-height:100vh; width:100%; }

    /* Sidebar */
    .sidebar{ width: 250px; padding:18px; }
    .sidebar .shell{
      height: calc(100vh - 36px);
      border-radius: var(--radius2);
      background: linear-gradient(180deg, rgba(17,24,39,.98), rgba(31,41,55,.96));
      box-shadow: var(--shadow2);
      overflow:auto;
    }
    .sidebar .shell *{ color:#fff; }

    /* Main */
    .main{ flex:1; padding: 18px 18px 28px; }
    .container{ max-width: 1400px; margin: 0 auto; }

    /* Top controls */
    .topbar{
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(229,231,235,1);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      padding: 12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
    }

    .leftPills{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap: wrap;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(229,231,235,1);
      background: #fff;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(15,23,42,.06);
      white-space: nowrap;
    }

    .dot{
      width: 10px; height: 10px; border-radius: 999px;
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(239,68,68,.16);
    }
    .dot.ok{
      background: var(--ok);
      box-shadow: 0 0 0 4px rgba(34,197,94,.18);
    }

    .rightActions{
      display:flex;
      align-items:center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content:flex-end;
    }

    .btn{
      border: 1px solid rgba(229,231,235,1);
      background: #fff;
      color: var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
      font-weight: 1000;
      font-size: 12px;
      transition: all .16s ease;
      display:inline-flex;
      align-items:center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(15,23,42,.06);
      user-select:none;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 12px 28px rgba(15,23,42,.10); }
    .btn:active{ transform: translateY(0px) scale(.99); }

    .btnPrimary{
      background: linear-gradient(135deg, rgba(79,70,229,1), rgba(37,99,235,1));
      color:#fff;
      border-color: transparent;
      box-shadow: 0 14px 34px rgba(79,70,229,.24);
    }

    /* Active calls grid (LARGE cards) */
    .gridWrap{ margin-top: 16px; }
    .grid{
      display:grid;
      gap: 18px;
      grid-template-columns: repeat(2, minmax(520px, 1fr));
      align-items: stretch;
    }
    @media (max-width: 1280px){
      .grid{ grid-template-columns: 1fr; }
    }

    /* ===== Card + Ring animation ===== */
    .card{
      position:relative;
      border-radius: 28px;
      overflow: visible; /* allow rings outside */
      min-height: 720px;
    }

    /* Inner actual card container */
    .cardInner{
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(229,231,235,1);
      border-radius: 28px;
      box-shadow: var(--shadow2);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 720px;
      position:relative;
      z-index: 2;
    }

    /* Rings: show "call is coming" */
    .card.ringing::before,
    .card.ringing::after{
      content:"";
      position:absolute;
      inset: -12px;            /* ring outside */
      border-radius: 34px;
      border: 2px solid rgba(79,70,229,.0);
      opacity: 0;
      transform: scale(.98);
      pointer-events:none;
      z-index: 1;
    }

    .card.ringing::before{
      border-color: color-mix(in srgb, var(--ring, #4f46e5) 70%, transparent);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--ring, #4f46e5) 25%, transparent);
      animation: ringPulse 1.6s ease-out infinite;
    }
    .card.ringing::after{
      inset: -22px;
      border-color: color-mix(in srgb, var(--ring, #4f46e5) 45%, transparent);
      animation: ringPulse2 1.6s ease-out infinite;
    }

    @keyframes ringPulse{
      0%   { opacity:.65; transform: scale(.98); filter: blur(0px); }
      60%  { opacity:.10; transform: scale(1.03); }
      100% { opacity:0;   transform: scale(1.06); }
    }
    @keyframes ringPulse2{
      0%   { opacity:.25; transform: scale(.98); }
      75%  { opacity:.06; transform: scale(1.05); }
      100% { opacity:0;   transform: scale(1.10); }
    }

    /* Reduce motion support */
    @media (prefers-reduced-motion: reduce){
      .card.ringing::before,
      .card.ringing::after{ animation:none; opacity:.25; transform:none; }
    }

    /* Card header */
    .cardHead{
      padding: 16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(229,231,235,1);
      background: rgba(248,250,252,.95);
    }

    .headLeft{
      display:flex;
      align-items:center;
      gap: 14px;
      min-width:0;
    }

    .callIcon{
      width: 44px;
      height: 44px;
      border-radius: 16px;
      display:grid;
      place-items:center;
      background: rgba(37,99,235,.10);
      border: 1px solid rgba(229,231,235,1);
      color: rgba(37,99,235,1);
      flex: 0 0 auto;
    }

    .hTitle{
      display:flex;
      flex-direction:column;
      gap: 4px;
      min-width:0;
    }
    .hTitle .t1{
      margin:0;
      font-weight: 1100;
      font-size: 22px;
      letter-spacing:-0.02em;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .hTitle .t2{
      margin:0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(229,231,235,1);
      background: rgba(79,70,229,.08);
      color: rgba(79,70,229,1);
      font-size: 12px;
      font-weight: 1100;
      white-space: nowrap;
    }
    .badge .miniDot{
      width: 8px; height: 8px; border-radius: 999px;
      background: rgba(79,70,229,1);
      box-shadow: 0 0 0 4px rgba(79,70,229,.12);
    }

    /* ===== Camera area: REMOVE BLUE CENTER COLOR ===== */
    .camera{
      margin: 14px 16px 0;
      border-radius: 22px;
      border: 1px solid rgba(229,231,235,1);
      background:
        radial-gradient(520px 300px at 50% 40%, rgba(15,23,42,.06), transparent 65%),
        linear-gradient(180deg, #fafafa, #ffffff);
      flex:1;
      min-height: 520px;
      overflow:hidden;
      position:relative;
      display:grid;
      place-items:center;
    }

    .camera img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .camIcon{ opacity:.55; width: 64px; height: 64px; }
    .camPlaceholderText{
      margin-top: 10px;
      font-size: 12px;
      font-weight: 900;
      color: rgba(100,116,139,.9);
      text-align:center;
    }

    .meta{
      margin: 12px 16px 16px;
      border-radius: 22px;
      border: 1px solid rgba(229,231,235,1);
      background: rgba(248,250,252,.96);
      padding: 14px 14px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 18px;
    }
    .metaItem .k{
      font-size: 11px;
      font-weight: 1000;
      letter-spacing: .08em;
      color: rgba(100,116,139,.95);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .metaItem .v{
      font-size: 16px;
      font-weight: 1000;
      color: var(--text);
    }

    .empty{
      padding: 26px;
      text-align:center;
      color: var(--muted);
      font-weight: 1000;
      background: rgba(255,255,255,.88);
      border: 1px dashed rgba(229,231,235,1);
      border-radius: 26px;
      box-shadow: var(--shadow);
    }

    /* Responsive hide sidebar on small screens */
    @media (max-width: 1024px){
      .sidebar{ display:none; }
      .main{ padding: 14px; }
    }

    /* =========================
       FULLSCREEN BEHAVIOR
       ========================= */
    body.fsMode{
      background: #f8fafc;
    }
    body.fsMode .topbar{ display:none; }
    body.fsMode .main{ padding: 10px; }
    body.fsMode .container{ max-width: none; }
    body.fsMode .gridWrap{ margin-top: 0; }

    /* Sidebar overlay drawer in fullscreen */
    body.fsMode .sidebar{
      display:block;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      width: 280px;
      padding: 12px;
      z-index: 1200;
      pointer-events: none;
    }
    body.fsMode .sidebar .shell{
      height: calc(100vh - 24px);
      transform: translateX(calc(-100% - 14px));
      transition: transform .22s ease;
      pointer-events: auto;
      border-radius: 22px;
    }
    body.fsMode.fsSidebarOpen .sidebar{ pointer-events: auto; }
    body.fsMode.fsSidebarOpen .sidebar .shell{ transform: translateX(0); }

    .fsBackdrop{
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,.35);
      backdrop-filter: blur(4px);
      z-index: 1100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }
    body.fsMode.fsSidebarOpen .fsBackdrop{
      opacity: 1;
      pointer-events: auto;
    }

    .fsHandle{
      position: fixed;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 72px;
      border-radius: 999px;
      border: 1px solid rgba(229,231,235,1);
      background: rgba(255,255,255,.92);
      box-shadow: 0 10px 30px rgba(15,23,42,.16);
      z-index: 1300;
      display:none;
      cursor:pointer;
      user-select:none;
      align-items:center;
      justify-content:center;
    }
    body.fsMode .fsHandle{ display:flex; }
    body.fsMode.fsSidebarOpen .fsHandle{ opacity: .25; }

    .fsHandle .bars{
      width: 14px;
      height: 14px;
      position: relative;
      opacity: .7;
    }
    .fsHandle .bars::before{
      content:"";
      position:absolute;
      left:0; right:0;
      top: 3px;
      height: 2px;
      background: rgba(15,23,42,.75);
      border-radius: 999px;
      box-shadow: 0 4px 0 rgba(15,23,42,.75), 0 8px 0 rgba(15,23,42,.75);
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <div id="sidebar" class="shell"></div>
    </aside>

    <main class="main">
      <div class="container">

        <div class="topbar">
          <div class="leftPills">
            <div class="pill">
              <span id="active-count-pill">0</span>
              <span>Active</span>
            </div>

            <div class="pill" title="WebSocket status">
              <span id="ws-status" class="dot"></span>
              <span id="ws-text">Connecting</span>
            </div>
          </div>

          <div class="rightActions">
            <button class="btn" onclick="app.toggleShowCameras()">
              <span id="camera-toggle-text">Show Cameras</span>
            </button>

            <button class="btn" onclick="app.toggleAutoRefresh()">
              <span>Auto:</span>
              <strong id="auto-refresh-text">ON</strong>
            </button>

            <button class="btn btnPrimary" onclick="app.toggleFullscreen()">
              <span>⛶</span>
              <span id="fullscreen-text">Fullscreen</span>
            </button>
          </div>
        </div>

        <!-- ONLY ACTIVE CALLS -->
        <div class="gridWrap">
          <div id="active-grid" class="grid">
            <div class="empty">Loading active calls...</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Fullscreen: backdrop + handle -->
  <div id="fs-backdrop" class="fsBackdrop" onclick="app.closeFsSidebar()"></div>
  <div id="fs-handle" class="fsHandle" title="Menu" onclick="app.toggleFsSidebar()">
    <div class="bars" aria-hidden="true"></div>
  </div>

  <script>
    const app = {
      data: {
        beds: [],
        bedMap: {},
        ws: null,
        autoRefresh: true,
        showCameras: false,
        customColors: {},
        activeByBed: {},
      },

      _activeFetchInFlight: false,
      _wsDebounceTimer: null,

      pick(obj, ...keys) {
        if (!obj) return undefined;
        for (const k of keys) {
          const v = obj[k];
          if (v !== undefined && v !== null && v !== '') return v;
        }
        return undefined;
      },
      asArray(maybe) {
        if (Array.isArray(maybe)) return maybe;
        if (maybe && Array.isArray(maybe.events)) return maybe.events;
        if (maybe && Array.isArray(maybe.data)) return maybe.data;
        return [];
      },
      normEvent(ev) {
        const e = {
          id: this.pick(ev, 'id'),
          status: this.pick(ev, 'status'),
          event_type: this.pick(ev, 'event_type', 'eventType', 'event'),
          system_timestamp: this.pick(ev, 'system_timestamp', 'systemTimestamp', 'timestamp', 'time'),
          bed_id: this.pick(ev, 'bed_id', 'bedId'),
          bed_name: this.pick(ev, 'bed_name', 'bedName'),
          bed_number: this.pick(ev, 'bed_number', 'bedNumber'),
          room_name: this.pick(ev, 'room_name', 'roomName'),
          ward_name: this.pick(ev, 'ward_name', 'wardName'),
          floor_name: this.pick(ev, 'floor_name', 'floorName'),
          camera_available: !!this.pick(ev, 'camera_available', 'cameraAvailable'),
          camera_url: this.pick(ev, 'camera_url', 'cameraUrl'),
        };

        const bid = e.bed_id != null ? String(e.bed_id) : '';
        const b = bid ? this.data.bedMap[bid] : null;
        if (b) {
          e.bed_name = e.bed_name || b.bed_name;
          e.bed_number = e.bed_number || b.bed_number;
          e.room_name = e.room_name || b.room_name;
          e.ward_name = e.ward_name || b.ward_name;
          e.floor_name = e.floor_name || b.floor_name;
        }

        const camConfigured = this.pick(ev, 'cameraConfigured', 'camera_configured');
        if (!e.camera_available && camConfigured === true) e.camera_available = true;

        return e;
      },
      normBed(b) {
        return {
          id: this.pick(b, 'id'),
          bed_name: this.pick(b, 'bed_name', 'bedName'),
          bed_number: this.pick(b, 'bed_number', 'bedNumber'),
          room_name: this.pick(b, 'room_name', 'roomName'),
          ward_name: this.pick(b, 'ward_name', 'wardName'),
          floor_name: this.pick(b, 'floor_name', 'floorName')
        };
      },

      async provideSidebar(){
        const targets = ["/sidebar.html", "/templates/sidebar.html"];
        for (const url of targets) {
          try{
            const r = await fetch(url);
            if (!r.ok) continue;
            const el = document.getElementById("sidebar");
            if (el) el.innerHTML = await r.text();
            return;
          }catch{}
        }
      },

      async init(){
        await this.provideSidebar();
        await this.loadCustomColors();
        await this.loadBeds();
        await this.loadActiveCalls();

        this.setupWebSocket();

        setInterval(() => {
          if (this.data.autoRefresh) this.loadActiveCalls();
        }, 5000);

        setInterval(() => this.loadCustomColors(), 30000);

        document.addEventListener('fullscreenchange', () => {
          const on = !!document.fullscreenElement;
          document.body.classList.toggle('fsMode', on);
          if (!on) document.body.classList.remove('fsSidebarOpen');
          document.getElementById('fullscreen-text').textContent = on ? 'Exit Fullscreen' : 'Fullscreen';
        });

        // keyboard shortcuts in fullscreen
        window.addEventListener('keydown', (e) => {
          if (e.key === 'm' || e.key === 'M') {
            if (document.fullscreenElement) this.toggleFsSidebar();
          }
          if (e.key === 'c' || e.key === 'C') this.toggleShowCameras();
          if (e.key === 'a' || e.key === 'A') this.toggleAutoRefresh();
          if (e.key === 'f' || e.key === 'F') this.toggleFullscreen();
        });
      },

      setupWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        this.data.ws = new WebSocket(`${protocol}://${window.location.host}/ws`);

        this.data.ws.onopen = () => this.updateWSStatus(true);

        this.data.ws.onmessage = () => {
          clearTimeout(this._wsDebounceTimer);
          this._wsDebounceTimer = setTimeout(() => this.loadActiveCalls(), 200);
        };

        this.data.ws.onerror = () => this.updateWSStatus(false);
        this.data.ws.onclose = () => {
          this.updateWSStatus(false);
          setTimeout(() => this.setupWebSocket(), 3000);
        };
      },

      updateWSStatus(connected) {
        const status = document.getElementById('ws-status');
        const text = document.getElementById('ws-text');

        if (connected) {
          status.className = 'dot ok';
          text.textContent = 'Connected';
        } else {
          status.className = 'dot';
          text.textContent = 'Disconnected';
        }
      },

      async loadCustomColors() {
        try {
          const response = await fetch('/api/config/colors');
          const data = await response.json();

          const next = {};
          const arr = data.colors || data || [];
          if (Array.isArray(arr)) {
            arr.forEach(c => {
              const key = (this.pick(c, 'event_type', 'eventType') || '').toLowerCase().trim();
              const col = this.pick(c, 'color', 'primary_color', 'primaryColor');
              if (key && col) next[key] = col;
            });
          }
          this.data.customColors = next;
        } catch (e) {
          console.error("[calls] colors error:", e);
        }
      },

      async loadBeds(){
        try{
          const bedsRes = await fetch('/api/config/beds');
          const bedsRaw = await bedsRes.json();
          const beds = bedsRaw.beds || bedsRaw || [];
          const normBeds = (Array.isArray(beds) ? beds : []).map(b0 => this.normBed(b0));
          this.data.beds = normBeds;

          this.data.bedMap = {};
          this.data.beds.forEach(b => { this.data.bedMap[String(b.id)] = b; });
        }catch(e){
          console.error("[calls] beds error:", e);
        }
      },

      async loadActiveCalls() {
        if (this._activeFetchInFlight) return;
        this._activeFetchInFlight = true;

        try {
          const response = await fetch('/api/events/recent?limit=200');
          const raw = await response.json();
          const events = this.asArray(raw);

          const normalized = events.map(ev => this.normEvent(ev));

          const active = normalized.filter(e =>
            (String(e.status || '').toLowerCase() === 'active') &&
            e.bed_id != null
          );

          // latest per bed
          const map = {};
          active.forEach(ev => {
            const bid = String(ev.bed_id);
            const existing = map[bid];

            const evTs = this.parseTs(ev.system_timestamp);
            const exTs = existing ? this.parseTs(existing.system_timestamp) : null;

            if (!existing || (evTs && exTs && evTs > exTs) || (evTs && !exTs)) {
              map[bid] = ev;
            }
          });

          this.data.activeByBed = map;
          this.renderActiveOnly();
        } catch (e) {
          console.error("[calls] loadActiveCalls error:", e);
        } finally {
          this._activeFetchInFlight = false;
        }
      },

      renderActiveOnly(){
        const grid = document.getElementById('active-grid');
        const activeCount = Object.keys(this.data.activeByBed || {}).length;

        const pill = document.getElementById('active-count-pill');
        if (pill) pill.textContent = String(activeCount);

        if (activeCount === 0){
          grid.innerHTML = `<div class="empty">No active calls</div>`;
          return;
        }

        let list = Object.values(this.data.activeByBed);
        list.sort((a,b) => {
          const at = this.parseTs(a.system_timestamp)?.getTime() || 0;
          const bt = this.parseTs(b.system_timestamp)?.getTime() || 0;
          return bt - at;
        });

        grid.innerHTML = list.map(ev => this.cardHtml(ev)).join('');
      },

      getDefaultColor(t) {
        const defaults = {
          call: '#3b82f6',
          emergency: '#ef4444',
          alarm: '#f59e0b',
          assistance: '#8b5cf6',
          accept: '#10b981',
          cancel: '#6b7280',
          presence: '#06b6d4',
          present: '#06b6d4',
          reset: '#64748b',
          unknown: '#4f46e5'
        };
        return defaults[t] || '#4f46e5';
      },
      getEventColor(eventType) {
        const normalized = String(eventType || '').toLowerCase().trim();
        return this.data.customColors[normalized] || this.getDefaultColor(normalized);
      },

      cardHtml(call){
        const eventType = call.event_type || call.eventType || call.event || 'Unknown';

        // Ring color = event color (Call=blue, Emergency=red, etc.)
        const ring = this.getEventColor(eventType);

        const floor = call.floor_name || call.floorName || '—';
        const ward  = call.ward_name  || call.wardName  || '—';

        const title = call.bed_name || call.bedName || ('Bed ' + (call.bed_number || call.bedNumber || 'N/A'));
        const subtitle = call.room_name || call.roomName || '—';

        const ts = call.system_timestamp || call.systemTimestamp || '';
        const timeAgo = this.getTimeAgo(ts);

        const camAvail = !!(call.camera_available ?? call.cameraAvailable);
        const camSrc = this.getCameraSrc(call);

        return `
          <div class="card ringing" style="--ring:${this.escapeAttr(ring)};">
            <div class="cardInner">

              <div class="cardHead">
                <div class="headLeft">
                  <div class="callIcon" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                      <path d="M6.6 10.8c1.7 3.3 3.9 5.5 7.2 7.2l2.4-2.4c.3-.3.8-.4 1.2-.3 1.3.4 2.7.7 4.1.7.7 0 1.2.5 1.2 1.2V21c0 .7-.5 1.2-1.2 1.2C10.7 22.2 1.8 13.3 1.8 2.7 1.8 2 2.3 1.5 3 1.5h3.9c.7 0 1.2.5 1.2 1.2 0 1.4.2 2.8.7 4.1.1.4 0 .9-.3 1.2L6.6 10.8z" fill="currentColor"/>
                    </svg>
                  </div>
                  <div class="hTitle">
                    <p class="t1">${this.escapeHtml(title)}</p>
                    <p class="t2">${this.escapeHtml(subtitle)}</p>
                  </div>
                </div>

                <div class="badge" title="Event type">
                  <span class="miniDot"></span>
                  ${this.escapeHtml(eventType).toUpperCase()}
                </div>
              </div>

              <div class="camera">
                ${
                  this.data.showCameras && camAvail
                    ? `<img src="${camSrc}" loading="lazy" decoding="async"
                          referrerpolicy="no-referrer"
                          onerror="this.outerHTML='<div><svg class=&quot;camIcon&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot;><path d=&quot;M9 3h6l1 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l1-2Zm3 16a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z&quot; fill=&quot;#9aa4b2&quot;/></svg><div class=&quot;camPlaceholderText&quot;>Camera not reachable</div></div>'" />`
                    : `<div>
                        <svg class="camIcon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                          <path d="M9 3h6l1 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l1-2Zm3 16a5 5 0 1 0 0-10 5 5 0 0 0 0 10Z" fill="#9aa4b2"/>
                        </svg>
                        <div class="camPlaceholderText">
                          ${this.data.showCameras ? (camAvail ? 'Loading…' : 'No camera available') : 'Cameras hidden'}
                        </div>
                      </div>`
                }
              </div>

              <div class="meta">
                <div class="metaItem">
                  <div class="k">Floor</div>
                  <div class="v">${this.escapeHtml(floor)}</div>
                </div>
                <div class="metaItem">
                  <div class="k">Ward</div>
                  <div class="v">${this.escapeHtml(ward)}</div>
                </div>
                <div class="metaItem">
                  <div class="k">Time</div>
                  <div class="v">${this.escapeHtml(timeAgo)}</div>
                </div>
                <div class="metaItem">
                  <div class="k">Status</div>
                  <div class="v">Active</div>
                </div>
              </div>

            </div>
          </div>
        `;
      },

      getCameraSrc(call) {
        const cu = call.camera_url || call.cameraUrl;
        if (cu) return cu;
        const bedName = call.bed_name || call.bedName || 'UnknownBed';
        return `/camera/${encodeURIComponent(bedName)}`;
      },

      toggleShowCameras(){
        this.data.showCameras = !this.data.showCameras;
        const el = document.getElementById('camera-toggle-text');
        if (el) el.textContent = this.data.showCameras ? 'Hide Cameras' : 'Show Cameras';
        this.renderActiveOnly();
      },

      toggleAutoRefresh(){
        this.data.autoRefresh = !this.data.autoRefresh;
        const el = document.getElementById('auto-refresh-text');
        if (el) el.textContent = this.data.autoRefresh ? 'ON' : 'OFF';
      },

      async toggleFullscreen(){
        try{
          if (!document.fullscreenElement){
            await document.documentElement.requestFullscreen();
          } else {
            await document.exitFullscreen();
          }
        }catch(e){
          console.warn("fullscreen error:", e);
        }
      },

      toggleFsSidebar(){
        if (!document.fullscreenElement) return;
        document.body.classList.toggle('fsSidebarOpen');
      },
      closeFsSidebar(){
        document.body.classList.remove('fsSidebarOpen');
      },

      parseTs(timestamp) {
        if (!timestamp) return null;
        const ts = String(timestamp).includes('T') ? String(timestamp) : String(timestamp).replace(' ', 'T');
        const d = new Date(ts);
        return isNaN(d.getTime()) ? null : d;
      },

      getTimeAgo(timestamp) {
        const timeObj = this.parseTs(timestamp);
        if (!timeObj) return '—';

        const now = new Date();
        const seconds = Math.floor((now - timeObj) / 1000);
        if (seconds < 0) return '0s ago';
        if (seconds < 60) return `${seconds}s ago`;
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
        return `${Math.floor(seconds / 86400)}d ago`;
      },

      escapeHtml(s) {
        return String(s || '')
          .replace(/&/g,'&amp;')
          .replace(/</g,'&lt;')
          .replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;')
          .replace(/'/g,'&#039;');
      },
      escapeAttr(s) {
        return this.escapeHtml(s).replace(/`/g, '&#096;');
      }
    };

    window.addEventListener('load', () => app.init());
  </script>
</body>
</html>
